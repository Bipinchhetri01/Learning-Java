services:
  backend:
    build: .
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=database
      - DB_USERNAME=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=mydb
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=mydb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d 
    ports:
      - "3306:3306"
volumes:
  db_data: